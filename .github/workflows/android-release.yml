name: Build Android AAB

# Builds the Evasale release AAB and attaches it to a GitHub Release so
# there's a direct download URL ending in .aab.
#
# 1. Add the 4 secrets listed in the README (or below) via the repo
#    Settings -> Secrets and variables -> Actions page.
# 2. Trigger the workflow via the Actions tab (workflow_dispatch).
# 3. Once the run finishes, go to the Releases page. Each run attaches a
#    new prerelease tag like v1.0-build-<run_id>. The .aab is the asset
#    attached to that release. Direct download URL pattern:
#      https://github.com/DavidNkana/breeez/releases/download/v1.0-build-<run_id>/app-release.aab
# 4. Drag the downloaded .aab into Play Console.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the upload .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEYSTORE_ALIAS     key alias (e.g. "breez")

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (optional, attached to the GitHub Release)'
        required: false
        default: ''

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create a release + upload asset

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          android-version: '34'
          android-components: 'platform-tools,build-tools;34.0.0,platforms;android-34'

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add it via Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          mkdir -p android/app/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/app/keystore/upload-key.keystore
          ls -la android/app/keystore/

      - name: Install web dependencies
        run: npm ci

      - name: Build web (Next.js production)
        run: npm run build

      - name: Sync Capacitor + Android
        run: npx cap sync android

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore/upload-key.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: ./gradlew bundleRelease

      - name: Verify AAB exists
        run: |
          find android/app/build/outputs/bundle/release -name 'app-release.aab' -ls

      - name: Create GitHub Release with the AAB attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build-${{ github.run_id }}
          name: Evasale Android AAB (build ${{ github.run_id }})
          body: |
            Auto-built Android release AAB for Evasale.
            ${{ github.event.inputs.release_notes }}
          prerelease: true
          generate_release_notes: false
          files: android/app/build/outputs/bundle/release/app-release.aab

      - name: Print direct download URL
        run: |
          TAG="v1.0-build-${{ github.run_id }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.aab"
          echo "DOWNLOAD AAB:"
          echo "$URL"
